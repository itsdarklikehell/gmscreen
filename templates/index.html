<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GM Screen - Multi-screen presentation tool for tabletop gaming">
    <meta name="theme-color" content="#1a1a2e">
    <title>GM Screen</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icon-16.png">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #dddddd;
            --accent-color: #1a1a2e;
            --accent-hover: #16213e;
            --shadow: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --navbar-bg: #1a1a2e;
            --navbar-text: #ffffff;
            --btn-bg: #1a1a2e;
            --btn-text: #ffffff;
            --btn-hover: #16213e;
            --success-bg: #e8f5e9;
            --success-text: #2e7d32;
            --error-bg: #ffebee;
            --error-text: #c62828;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a2e;
                --bg-secondary: #16213e;
                --bg-tertiary: #0f3460;
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --border-color: #0f3460;
                --accent-color: #e94560;
                --accent-hover: #ff6b6b;
                --shadow: rgba(0, 0, 0, 0.3);
                --card-bg: #16213e;
                --input-bg: #0f3460;
                --navbar-bg: #0f3460;
                --navbar-text: #e0e0e0;
                --btn-bg: #e94560;
                --btn-text: #ffffff;
                --btn-hover: #ff6b6b;
                --success-bg: #1b5e20;
                --success-text: #a5d6a7;
                --error-bg: #3e2723;
                --error-text: #ef9a9a;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .navbar {
            background-color: var(--navbar-bg);
            color: var(--navbar-text);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .navbar h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .navbar-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--btn-bg);
            color: var(--btn-text);
        }

        .btn-primary:hover {
            background-color: var(--btn-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: var(--error-bg);
            color: var(--error-text);
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 4px var(--shadow);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 4px 8px var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .toast.error {
            background-color: var(--error-bg);
            color: var(--error-text);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .dark-mode-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.3s ease;
        }

        .dark-mode-toggle:hover {
            background: var(--btn-hover);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            .navbar,
            .btn,
            .dark-mode-toggle {
                display: none !important;
            }

            body {
                background: white;
                color: black;
            }
        }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" id="dark-mode-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" style="display: none;" width="24" height="24">
            <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-14v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="24" height="24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
        </svg>
    </button>

    <nav class="navbar">
        <h1>GM Screen</h1>
        <div class="navbar-actions">
            <button class="btn btn-primary" onclick="showModal('system')">New System</button>
            <button class="btn btn-secondary" onclick="exportData()">Export</button>
            <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">Import</button>
            <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(this)">
        </div>
    </nav>

    <div class="container">
        <div class="grid" id="systems-grid">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <h3>No Systems Yet</h3>
                <p>Create your first view system to get started</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <div class="card-header">
                <h3 class="card-title" id="modal-title">New System</h3>
                <button class="btn btn-secondary" onclick="hideModal()">×</button>
            </div>
            <div id="modal-content">
                <form id="system-form" onsubmit="saveSystem(event)">
                    <div class="form-group">
                        <label for="system-name">Name</label>
                        <input type="text" id="system-name" required>
                    </div>
                    <div class="form-group">
                        <label for="system-location">Location</label>
                        <input type="text" id="system-location">
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Dark mode toggle
        (function() {
            const toggle = document.getElementById('dark-mode-toggle');
            const iconSun = toggle.querySelector('.icon-sun');
            const iconMoon = toggle.querySelector('.icon-moon');

            const savedTheme = localStorage.getItem('gmscreen-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                document.documentElement.style.setProperty('--bg-primary', '#1a1a2e');
                document.documentElement.style.setProperty('--bg-secondary', '#16213e');
                document.documentElement.style.setProperty('--bg-tertiary', '#0f3460');
                document.documentElement.style.setProperty('--text-primary', '#e0e0e0');
                document.documentElement.style.setProperty('--text-secondary', '#b0b0b0');
                document.documentElement.style.setProperty('--border-color', '#0f3460');
                document.documentElement.style.setProperty('--accent-color', '#e94560');
                document.documentElement.style.setProperty('--accent-hover', '#ff6b6b');
                document.documentElement.style.setProperty('--shadow', 'rgba(0, 0, 0, 0.3)');
                document.documentElement.style.setProperty('--card-bg', '#16213e');
                document.documentElement.style.setProperty('--input-bg', '#0f3460');
                document.documentElement.style.setProperty('--navbar-bg', '#0f3460');
                document.documentElement.style.setProperty('--navbar-text', '#e0e0e0');
                document.documentElement.style.setProperty('--btn-bg', '#e94560');
                document.documentElement.style.setProperty('--btn-text', '#ffffff');
                document.documentElement.style.setProperty('--btn-hover', '#ff6b6b');
                document.documentElement.style.setProperty('--success-bg', '#1b5e20');
                document.documentElement.style.setProperty('--success-text', '#a5d6a7');
                document.documentElement.style.setProperty('--error-bg', '#3e2723');
                document.documentElement.style.setProperty('--error-text', '#ef9a9a');
                iconSun.style.display = 'block';
                iconMoon.style.display = 'none';
            }

            toggle.addEventListener('click', () => {
                const isDark = document.documentElement.style.getPropertyValue('--bg-primary') === '#1a1a2e';
                if (isDark) {
                    document.documentElement.style.setProperty('--bg-primary', '#ffffff');
                    document.documentElement.style.setProperty('--bg-secondary', '#f5f5f5');
                    document.documentElement.style.setProperty('--bg-tertiary', '#e0e0e0');
                    document.documentElement.style.setProperty('--text-primary', '#333333');
                    document.documentElement.style.setProperty('--text-secondary', '#666666');
                    document.documentElement.style.setProperty('--border-color', '#dddddd');
                    document.documentElement.style.setProperty('--accent-color', '#1a1a2e');
                    document.documentElement.style.setProperty('--accent-hover', '#16213e');
                    document.documentElement.style.setProperty('--shadow', 'rgba(0, 0, 0, 0.1)');
                    document.documentElement.style.setProperty('--card-bg', '#ffffff');
                    document.documentElement.style.setProperty('--input-bg', '#ffffff');
                    document.documentElement.style.setProperty('--navbar-bg', '#1a1a2e');
                    document.documentElement.style.setProperty('--navbar-text', '#ffffff');
                    document.documentElement.style.setProperty('--btn-bg', '#1a1a2e');
                    document.documentElement.style.setProperty('--btn-text', '#ffffff');
                    document.documentElement.style.setProperty('--btn-hover', '#16213e');
                    document.documentElement.style.setProperty('--success-bg', '#e8f5e9');
                    document.documentElement.style.setProperty('--success-text', '#2e7d32');
                    document.documentElement.style.setProperty('--error-bg', '#ffebee');
                    document.documentElement.style.setProperty('--error-text', '#c62828');
                    localStorage.setItem('gmscreen-theme', 'light');
                    iconSun.style.display = 'none';
                    iconMoon.style.display = 'block';
                } else {
                    document.documentElement.style.setProperty('--bg-primary', '#1a1a2e');
                    document.documentElement.style.setProperty('--bg-secondary', '#16213e');
                    document.documentElement.style.setProperty('--bg-tertiary', '#0f3460');
                    document.documentElement.style.setProperty('--text-primary', '#e0e0e0');
                    document.documentElement.style.setProperty('--text-secondary', '#b0b0b0');
                    document.documentElement.style.setProperty('--border-color', '#0f3460');
                    document.documentElement.style.setProperty('--accent-color', '#e94560');
                    document.documentElement.style.setProperty('--accent-hover', '#ff6b6b');
                    document.documentElement.style.setProperty('--shadow', 'rgba(0, 0, 0, 0.3)');
                    document.documentElement.style.setProperty('--card-bg', '#16213e');
                    document.documentElement.style.setProperty('--input-bg', '#0f3460');
                    document.documentElement.style.setProperty('--navbar-bg', '#0f3460');
                    document.documentElement.style.setProperty('--navbar-text', '#e0e0e0');
                    document.documentElement.style.setProperty('--btn-bg', '#e94560');
                    document.documentElement.style.setProperty('--btn-text', '#ffffff');
                    document.documentElement.style.setProperty('--btn-hover', '#ff6b6b');
                    document.documentElement.style.setProperty('--success-bg', '#1b5e20');
                    document.documentElement.style.setProperty('--success-text', '#a5d6a7');
                    document.documentElement.style.setProperty('--error-bg', '#3e2723');
                    document.documentElement.style.setProperty('--error-text', '#ef9a9a');
                    localStorage.setItem('gmscreen-theme', 'dark');
                    iconSun.style.display = 'block';
                    iconMoon.style.display = 'none';
                }
            });
        })();

        // API functions
        async function loadSystems() {
            try {
                const response = await fetch('/api/systems');
                const systems = await response.json();
                renderSystems(systems);
            } catch (error) {
                showToast('Failed to load systems', 'error');
            }
        }

        function renderSystems(systems) {
            const grid = document.getElementById('systems-grid');
            if (systems.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="9" y1="21" x2="9" y2="9"></line>
                        </svg>
                        <h3>No Systems Yet</h3>
                        <p>Create your first view system to get started</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = systems.map(system => `
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">${system.name}</h3>
                        <div>
                            <button class="btn btn-secondary" onclick="editSystem(${system.id})">Edit</button>
                            <button class="btn btn-danger" onclick="deleteSystem(${system.id})">Delete</button>
                        </div>
                    </div>
                    <p><strong>Location:</strong> ${system.location || 'Not set'}</p>
                    <p><strong>Viewports:</strong> ${system.viewports ? system.viewports.length : 0}</p>
                    <p><strong>Playlists:</strong> ${system.playlists ? system.playlists.length : 0}</p>
                </div>
            `).join('');
        }

        function showModal(type) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-title').textContent = 'New System';
            document.getElementById('system-form').reset();
        }

        function hideModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function saveSystem(event) {
            event.preventDefault();
            const name = document.getElementById('system-name').value;
            const location = document.getElementById('system-location').value;

            try {
                const response = await fetch('/api/systems', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location })
                });

                if (response.ok) {
                    showToast('System created successfully', 'success');
                    hideModal();
                    loadSystems();
                } else {
                    showToast('Failed to create system', 'error');
                }
            } catch (error) {
                showToast('Failed to create system', 'error');
            }
        }

        async function editSystem(id) {
            try {
                const response = await fetch(`/api/systems/${id}`);
                const system = await response.json();
                document.getElementById('system-name').value = system.name;
                document.getElementById('system-location').value = system.location || '';
                document.getElementById('modal').style.display = 'flex';
                document.getElementById('modal-title').textContent = 'Edit System';
            } catch (error) {
                showToast('Failed to load system', 'error');
            }
        }

        async function deleteSystem(id) {
            if (!confirm('Are you sure you want to delete this system?')) return;

            try {
                const response = await fetch(`/api/systems/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('System deleted successfully', 'success');
                    loadSystems();
                } else {
                    showToast('Failed to delete system', 'error');
                }
            } catch (error) {
                showToast('Failed to delete system', 'error');
            }
        }

        async function exportData() {
            try {
                const response = await fetch('/api/export');
                const data = await response.json();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gmscreen-export-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Data exported successfully', 'success');
            } catch (error) {
                showToast('Failed to export data', 'error');
            }
        }

        async function importData(input) {
            const file = input.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);
                const response = await fetch('/api/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showToast('Data imported successfully', 'success');
                    loadSystems();
                } else {
                    showToast('Failed to import data', 'error');
                }
            } catch (error) {
                showToast('Failed to import data', 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Load systems on page load
        loadSystems();

        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registered:', registration.scope))
                    .catch(error => console.log('SW registration failed:', error));
            });
        }
    </script>
</body>
</html>
